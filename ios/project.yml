name: StrongholdProtocol
options:
  bundleIdPrefix: io.github.sganggs
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: App/Sources/bridge.h
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad（iPad 全方向自适应）
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO               # 未签名构建（TrollStore 直装 / 其他工具重签）
    ENABLE_BITCODE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17   # node 18 / V8 10.x headers require C++17
    OTHER_LDFLAGS:
      - "-lz"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/third_party/include"

targets:
  StrongholdProtocol:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      # node headers are for the C++ shim only — never compiled into the target
      - path: third_party/include
        buildPhase: none
      # folder reference (blue): the whole game ships verbatim into the bundle
      - path: Resources/nodejs-project
        buildPhase: resources
        type: folder
    dependencies:
      # dynamic framework shipping node::Start (device + simulator slices)
      - framework: third_party/NodeMobile.xcframework
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 卫戍协议
        CFBundleShortVersionString: "0.1.3"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIBackgroundModes:
          - audio    # BGM 播放期间后台不被冻结（保活：挂后台时服务器继续服务朋友）
        UIFileSharingEnabled: true          # 「文件」App 可直取 Documents/logs 排障
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: "用于在同一 Wi-Fi 内发现并连接游戏房主（局域网联机）"
        NSBonjourServices:
          - "_stronghold._tcp"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true      # 房主是局域网 http://…：iOS 需显式放行
        ITSAppUsesNonExemptEncryption: false
